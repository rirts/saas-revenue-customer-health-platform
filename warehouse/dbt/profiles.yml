saas_revenue_customer_health_platform:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'analytics') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'analytics_pwd') }}"
      port: "{{ env_var('POSTGRES_LOCAL_PORT', env_var('POSTGRES_PORT', '5432')) | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'saas_platform') }}"
      schema: analytics
      threads: 4
