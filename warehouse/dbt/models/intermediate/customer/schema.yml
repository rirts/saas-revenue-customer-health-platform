version: 2

models:
  - name: int_customer__account_base
    description: Account-level customer base combining CRM, contacts, deals, billing customer, and subscription lifecycle information.
    columns:
      - name: account_id
        description: Unique account identifier.
        tests:
          - not_null
          - unique

      - name: account_name
        description: Account or company name.
        tests:
          - not_null

      - name: segment
        description: Customer segment.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SMB', 'Mid-Market', 'Enterprise']

      - name: account_lifecycle_stage
        description: Account lifecycle stage derived from CRM and subscription status.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - active_customer
                  - past_due_customer
                  - churned_customer
                  - won_not_subscribed
                  - prospect

      - name: current_mrr_usd
        description: Current active or past-due MRR associated with the account.
        tests:
          - not_null

      - name: current_arr_usd
        description: Current active or past-due ARR associated with the account.
        tests:
          - not_null
          
  - name: int_customer__health_signals
    description: Account-level customer health signal model combining revenue, product usage, support burden, and relationship strength.
    columns:
      - name: account_id
        description: Unique account identifier.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('int_customer__account_base')
                field: account_id

      - name: account_lifecycle_stage
        description: Account lifecycle stage from the account base model.
        tests:
          - not_null

      - name: current_mrr_usd
        description: Current MRR associated with the account.
        tests:
          - not_null

      - name: usage_score
        description: Health score component based on product usage volume.
        tests:
          - not_null

      - name: adoption_score
        description: Health score component based on feature adoption.
        tests:
          - not_null

      - name: payment_score
        description: Health score component based on collection and overdue invoices.
        tests:
          - not_null

      - name: support_score
        description: Health score component based on support burden.
        tests:
          - not_null

      - name: relationship_score
        description: Health score component based on contact coverage.
        tests:
          - not_null

      - name: customer_health_score
        description: Total customer health score from 0 to 100.
        tests:
          - not_null

      - name: customer_health_segment
        description: Customer health segment derived from the risk-adjusted health score.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['healthy', 'watch', 'at_risk', 'critical', 'not_customer']

      - name: is_churn_risk
        description: Boolean flag indicating whether the account shows churn-risk signals.
        tests:
          - not_null
      
      - name: is_current_customer
        description: Boolean flag indicating whether the account has active or past-due recurring revenue.
        tests:
          - not_null

      - name: low_usage_paid_account
        description: Boolean flag indicating whether a paying account has low or no product usage.
        tests:
          - not_null

      - name: payment_risk_flag
        description: Boolean flag indicating payment-related churn risk.
        tests:
          - not_null

      - name: support_risk_flag
        description: Boolean flag indicating support-related churn risk.
        tests:
          - not_null

      - name: raw_customer_health_score
        description: Customer health score before business risk caps.
        tests:
          - not_null