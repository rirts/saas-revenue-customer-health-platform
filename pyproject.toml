[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".venv",
    "warehouse/dbt/target",
    "warehouse/dbt/dbt_packages",
    "orchestration/airflow/logs",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"